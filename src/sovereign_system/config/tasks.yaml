classify_sensitivity:
  description: >
    Analyze the following learner query and classify its privacy zone:
    
    Query: {query}
    
    Consider:
    1. Does it contain PII? (names, IDs, locations)
    2. Does it reveal proprietary research topics?
    3. Could the intent be used to profile the learner?
    
    Output the zone (0-3) and detected sensitive elements.
  expected_output: "Zone classification with sensitivity analysis"
  agent: sovereign_manager

detect_sensitive_entities:
  description: >
    Extract all sensitive entities from the query:
    
    Query: {query}
    
    Identify and list the ACTUAL sensitive terms (e.g., CRISPR, HEK293, patient names).
    Output as comma-separated list of the original terms found.
  expected_output: "Comma-separated list of actual sensitive entity names found in query"
  agent: sensitivity_detector

generalize_query:
  description: >
    Transform the sensitive query into an abstract formulation.
    
    CRITICAL: The ONLY available tool is 'semantic_generalizer'. 
    
    1. READ the output of 'detect_sensitive_entities' task to get the list of entities (e.g. "John Smith, 12345").
    2. Original query: {query}
    
    You MUST call the tool exactly like this:
    Tool: semantic_generalizer
    Arguments:
      query: "{query}"
      sensitive_entities: (Insert the EXACT output string from detect_sensitive_entities here)
  expected_output: "SANITIZED query with MAPPING dictionary"
  agent: semantic_generalizer
  context:
    - detect_sensitive_entities

execute_cloud_query:
  description: >
    Process the generalized query using the external cloud model:
    
    Generalized Query: Use the 'SANITIZED' query output from the generalize_query task.
    
    Provide a comprehensive, technical answer to the abstract question.
    Do NOT attempt to guess the placeholders. Treat "Protocol-X" and "Cell-Type-A" as first-class scientific terms.
  expected_output: "Detailed technical response using the abstract terminology"
  agent: cloud_researcher
  context:
    - generalize_query

validate_response:
  description: >
    Validate the cloud response against trust criteria:
    
    Original query: {query}
    Generalized query: From the generalize_query task
    Cloud response: Use the output from the execute_cloud_query task.
    
    Check:
    1. Does response leak any sanitized information?
    2. Is response consistent with educational best practices?
    3. Does response contain hallucinations?
    
    Output the validated cloud response text.
  expected_output: "The validated cloud response text that is safe to re-contextualize"
  agent: trust_enforcer
  context:
    - generalize_query
    - execute_cloud_query

recontextualize_response:
  description: >
    Map the cloud response back to the learner's specific context.
    
    CRITICAL: You MUST use the 'recontextualizer' tool. No other action is allowed.
    
    Steps:
    1. Find the MAPPING from the generalize_query task output (looks like: {'Protocol-A': 'CRISPR', 'Cell-A': 'HEK293'})
    2. Get the response text from validate_response task
    3. Call the 'recontextualizer' tool with:
       - response: the full response text containing placeholders
       - mapping: "{'Protocol-A': 'CRISPR', 'Cell-A': 'HEK293'}" (as string)
    
    The final output MUST contain the original terms (CRISPR, HEK293), NOT placeholders (Protocol-A, Cell-Type-A).
  expected_output: "Personalized response with CRISPR and HEK293 restored"
  agent: recontextualizer
  context:
    - generalize_query
    - validate_response

update_competency:
  description: >
    Record this learning interaction in the competency vector using the 'evidence_curator' tool.
    
    1. EXTRACT 'zone' from the 'classify_sensitivity' task output (look for a number 0-3).
    2. EXTRACT 'response' from the 'recontextualize_response' task output (the final text).
    3. Use the original 'query'.
    4. Set 'interaction_type' to 'active'.
    
    Tool: evidence_curator
    Arguments:
      query: (original query)
      response: (the text from step 2)
      zone: (the number from step 1)
      interaction_type: "active"
  expected_output: "Competency vector update confirmation with ID and path"
  agent: competency_tracker
  context:
    - classify_sensitivity
    - recontextualize_response