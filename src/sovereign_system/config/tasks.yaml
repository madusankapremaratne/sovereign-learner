routing_task:
  description: >
    Analyze the incoming user query: "{user_query}". 
    Evaluate it against privacy levels: 0 (local-only) to 3 (direct cloud).
    Identify if the query requires semantic generalization or if it can be 
    processed by the local SLM immediately.
  expected_output: "A routing decision (Zone 0-3) and a brief justification."
  agent: sovereign_manager

pii_detection_task:
  description: >
    Scan the query: "{user_query}" for any Personally Identifiable Information (PII) 
    or domain-sensitive entities (e.g., specific chemical compounds, proprietary 
    research names, or medical conditions).
  expected_output: "A list of sensitive entities that must be masked."
  agent: sensitivity_detector
  context: [routing_task]

generalization_task:
  description: >
    Using the list of sensitive entities, rewrite the query: "{user_query}" 
    into a generalized version. Replace specific terms with abstract placeholders 
    (e.g., 'Protocol-X', 'Variable-A'). 
    Create a private 'Mapping Key' to store these associations locally.
  expected_output: "The generalized query and the hidden Mapping Key."
  agent: semantic_generalizer
  context: [pii_detection_task]

cloud_knowledge_task:
  description: >
    Take the generalized query from the previous task and provide a 
    comprehensive, high-quality technical response. Do not attempt to 
    uncover the specific identities behind the placeholders.
  expected_output: "A detailed technical guide based on the generalized terms."
  agent: cloud_researcher
  context: [generalization_task]

privacy_audit_task:
  description: >
    Review the cloud researcher's response. Perform a Differential Privacy Audit (DPA).
    Ensure that the cloud model has not inadvertently 'guessed' the user's specific 
    context or leaked any information that maps back to sensitive entities.
    USE the output_sanitizer tool to scrub any internal reasoning or leaked tokens 
    from your report.
  expected_output: "A DPA-validated report (Pass/Fail) with corrective feedback."
  agent: trust_enforcer
  context: [cloud_knowledge_task, pii_detection_task]

recontextualization_task:
  description: >
    Execute Symmetric Context Restoration (SCR). Using the 'Mapping Key' from 
    Stage 1, replace all abstract axioms with the original lived entities. 
    Perform a final 'Zero-Leak Finalization' sweep using the output_sanitizer tool 
    to ensure no hidden metadata, 'Thoughts', or unmasked placeholders remain 
    in the final response.
  expected_output: "The final notarized specific response for the user."
  agent: recontextualizer
  context: [generalization_task, privacy_audit_task]

competency_logging_task:
  description: >
    Update the user's local profile. Calculate the learning weight (Active=1.0, Passive=0.2) 
    for this interaction and update the competency vector V_Portfolio. 
    Pass the interaction data to the Curator for storage.
  expected_output: "Calculated weight and updated competency vector status."
  agent: competency_tracker
  context: [recontextualization_task]

data_sovereignty_task:
  description: >
    Securely store the raw query, the generalized query, and the final response 
    in the local ChromaDB. Ensure no sensitive data has left the local environment 
    unmasked.
  expected_output: "Confirmation of successful local database entry."
  agent: evidence_curator
  context: [competency_logging_task]