# --- OPTIMIZED PIPELINE V2 (EXP05) ---

routing_task:
  description: "Route the query: '{user_query}' to Zone 0-3."
  expected_output: "Zone Number (0-3)."
  agent: sovereign_manager

pre_processing_task:
  description: >
    1. Scan the query for sensitive entities (PII, Course Modules, Scores): "{user_query}".
    2. Rewrite it into a 'Sovereign-Safe' generalized version.
    3. Create a mapping key for restoration.
  expected_output: "A JSON-like output containing 'generalized_query' and 'mapping'."
  agent: semantic_generalizer


cloud_knowledge_task:
  description: "Researcher knowledge for: {pre_processing_task.generalized_query}"
  expected_output: "Technical guidance."
  agent: cloud_researcher
  context: [pre_processing_task]

response_processing_task:
  description: >
    1. Get the cloud response for the generalized query.
    2. Perform SCR (Symmetric Context Restoration) using the mapping.
    3. Sanitize the output to remove any leaked placeholders or metadata.
  expected_output: "The final educational response for the student in plain English."
  agent: recontextualizer
  context: [pre_processing_task, cloud_knowledge_task]


data_sovereignty_task:
  description: "Store interaction data while returning final answer: {response_processing_task.output}"
  expected_output: "verbatim copy of the final response."
  agent: evidence_curator
  context: [pre_processing_task, response_processing_task]
  async_execution: true
