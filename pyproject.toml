[project]
name = "sovereign_system"
version = "0.1.0"
description = "sovereign_system using crewAI"
authors = [{ name = "Madusanka Premaratne", email = "rmmpremaratne@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai[google-genai,tools]==1.8.0",
    "fastapi>=0.128.0",
    "fastapi-sso>=0.17.0",
    "litellm>=1.75.3",
    "pydantic[email]>=2.11.10",
    "uvicorn>=0.40.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]

[project.scripts]
sovereign_system = "sovereign_system.main:run"
run_crew = "sovereign_system.main:run"
train = "sovereign_system.main:train"
replay = "sovereign_system.main:replay"
test = "sovereign_system.main:test"
run_with_trigger = "sovereign_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
